<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知っておきたい！柴犬のコト</title>
    <link rel="stylesheet" href="../../DogMatch_Site/css/base.css">
    <link rel="stylesheet" href="../../DogMatch_Site/css/quiz.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP&family=Shippori+Mincho&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="page-transition" class="active"></div>
    <header class="header">
        <div class="header-inner">
            <a href="./index.html" class="header-logo">
                <img src="../../DogMatch_Picture/./DM_logo.png" alt="DogMatch-logo">
            </a>
            <button class="menu-button"></button>
            <!-- ボタンの説明的なの欲しい（肉球がメニューボタンだと分かりにくいから -->
            <div class="header-site-menu">
                <nav class="site-menu">
                    <ul>
                        <li><a href="../../index.html">Home</a></li>
                        <li><a href="./about.html">About</a></li>
                        <li><a href="./care.html">Care</a></li>
                        <li><a href="./life.html">Life</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <div class="quiz">
            <!-- クイズ自体 -->
            <div id="quiz-screen">
                <div class="progress" id="progress-text"></div>
                <p id="question-text"></p>
                <div class="choices" id="choices-area"></div>
            </div>
            <div id="result-screen">
                <div class="progress">結果発表</div>
                <div class="score" id="score-text"></div>
                <p class="message" id="message-text"></p>
                <div class="map">
                    <iframe src="https://www.google.com/maps?q=ペットショップ&output=embed" width="100%" height="400"
                        style="border:0" loading="lazy">
                        <!-- loadingはみせる位置を近くして読み込みを早くする -->
                    </iframe>
                </div>
                <div class="retry-btn">
                    <a onclick="restartQuiz()">もう一度挑戦する</a>
                    <a href="../../index.html">ホームに戻る</a>
                </div>
            </div>
        </div>
    </main>
    <script>
        //ここはメニューボタン（肉球）が押されたらメニューを出し、もう一度押されたら引っ込める役割
        const menuButton = document.querySelector('.menu-button');
        const headerSiteMenu = document.querySelector('.header-site-menu');
        menuButton.addEventListener('click', function () {
            headerSiteMenu.classList.toggle('show');
        });
        //1
        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('page-transition');
            requestAnimationFrame(() => {
                overlay.classList.remove('active'); // フェードアウト
            });
        });
        // リンククリック時:白くしてから遷移
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function (e) {
                const href = this.getAttribute('href');
                // hrefにクリックされたaタグのhref属性の値を読み込んでいる
                if (!href || href.startsWith('#')) {
                    return; // ここで処理を抜ける
                }
                e.preventDefault();//リンクを押した瞬間にすぐページが切り替わるのを止める。
                const overlay = document.getElementById('page-transition');
                overlay.classList.add('active');//→ 白いオーバーレイを表示する(すでに白い状態だから見た目上の変化はないけど、「今から白くなるぞ」という状態にする)
                //3
                setTimeout(() => {
                    window.location.href = href;
                }, 1000); // CSSのtransition時間と合わせる
            });
        });
        // カーソル設定
        let lastTime = 0;
        document.addEventListener('mousemove', function (e) {
            const now = Date.now(); // 今の時刻を取得
            if (now - lastTime < 150) {//時間設定
                return; // 前回置いてからまだINTERVALミリ秒経ってなければ何もしない
            }
            lastTime = now; // 今回置いた時刻を記録し直す
            const paw = document.createElement('img');//タグ作成
            paw.src = '../../DogMatch_Picture/cursor.png';
            paw.className = 'paw-trail';//cssで見た目を整えるための目印
            paw.style.left = e.pageX + 'px';
            paw.style.top = e.pageY + 'px';
            //マウスが動いたらその地点を記録
            document.body.appendChild(paw);//実際に追加

            // 一定時間後に消す(残り続けると重くなるため)
            setTimeout(() => {
                paw.remove();
            }, 800);
        });

        // ここからクイズ
        const questions = [
            {
                q: "柴犬の顔立ち、キツネ顔ともう一つは？",
                choices: ["パンダ顔", "ねこ顔", "たぬき顔"],
                answer: 2
            },
            {
                q: "柴犬の毛は一本に何色入ってる？",
                choices: ["1色のみ", "2色", "3色", "4色"],
                answer: 2
            },
            {
                q: "日本犬の中で柴犬はなんと言われている？",
                choices: ["唯一の小型犬", "唯一の天然記念物", "唯一の家庭犬"],
                answer: 0
            },
            {
                q: "肛門腺絞りは必ずしも人間がやるべき？",
                choices: ["はい", "いいえ"],
                answer: 1
            },
            {
                q: "柴犬の性格を説明するにはどれが最適？",
                choices: ["温厚", "ズル賢い", "甘えん坊", "お利口さん"],
                answer: 1
            },
            {
                q: "柴犬が生まれてくる8割の毛色はどれ？",
                choices: ["黒毛", "白毛", "胡麻柄", "赤毛"],
                answer: 3
            },
            {
                q: "他の犬と圧倒的に違う特徴とは？",
                choices: ["ご飯の食べ方", "人の扱い方", "泳ぎ方"],
                answer: 1
            }
        ];
        // 変数
        let currentIndex = 0; // 現在の問題数
        let correctCount = 0; // 正解数
        // このHTMLページから指定したID属性を持つものを一つずつ取得
        const progressText = document.getElementById('progress-text');
        const questionText = document.getElementById('question-text');
        const choicesArea = document.getElementById('choices-area');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const resultText = document.getElementById('score-text');

        // 問題表示（ここがメイン）
        function showQuestion() {
            const current = questions[currentIndex]; // 問題を取得
            // テキストを表示
            progressText.textContent = `第 ${currentIndex + 1} 問 / ${questions.length} 問`;
            questionText.textContent = current.q;
            // ここからボタンを作り、表示させる
            choicesArea.innerHTML = ""; //選択ボタンを作成（js上で）
            current.choices.forEach((choiceLabel, index) => {
                // choiceLabelに選択肢が一つずつ入って、indexはjsが勝手に数を数えてくれる
                const btn = document.createElement('button'); //ボタンをメモリ上に作成
                btn.className = 'choice-btn';//クラス名をつけてcss使える〜
                btn.textContent = 'choice-btn';
                btn.textContent = choiceLabel;
                btn.addEventListener('click', () => selectAnswer(index, btn));
                choicesArea.appendChild(btn); // ボタン完成、選択肢の欄に追加
            })
        }
        // 選択肢が押されたら↓
        function selectAnswer(selectedIndex, btnEl) {
            //選ばれたindexとbtn自体が引数
            const current = questions[currentIndex]; // 問題を取得
            const isCorrect = selectedIndex === current.answer;
            if (isCorrect) {
                correctCount++;
                btnEl.classList.add('correct'); //正解と不正解でボタンの色を変える（cssをくっつけるものを変える)
            } else {
                btnEl.classList.add('wrong');
                const allButton = document.querySelectorAll('.choice-btn'); //出力した選択肢を全て持ってくる
                allButton[current.answer].classList.add('answer')
            }
            // 一度押したら押せなくする
            document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
            // 時間を置いてから次の問題へ
            setTimeout(() => {
                currentIndex++;
                if (currentIndex < questions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 1000 //1秒まつ
            );
        }
        // 結果画面
        function showResult() {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            resultText.textContent = `${correctCount} / ${questions.length} 問正解`;
            let message = '';
            if (correctCount === questions.length) {
                message = '柴犬マスター！すべて知り尽くしてるね\nさあ、柴犬を探そう!';
            } else if (correctCount >= 5) {
                message = 'もうあなたは柴犬を知っている！\nもっと深くまで知ってみよう!';
            } else if (correctCount >= 3) {
                message = 'なかなかの柴犬通！もう少しで免許皆伝\n一度柴犬を探して、飼ってみてはいかが？';
            } else {
                message = 'まだまだ柴犬修行が必要かも。ページを読み返してみよう\nまた、柴犬を知るには飼うことが早い。さあ、君も柴犬を探してみよう!';
            }
            document.getElementById('message-text').textContent = message; //メッセージを表示(jsからの文字表示を理解してきたー！😄)
        }
        // リベンジ
        function restartQuiz() {
            currentIndex = 0; // 現在の問題数
            correctCount = 0; // 正解数
            quizScreen.style.display = 'block';
            resultScreen.style.display = 'none';
            showQuestion();
        }
        // 早速スタート！
        showQuestion();
    </script>
</body>

</html>
