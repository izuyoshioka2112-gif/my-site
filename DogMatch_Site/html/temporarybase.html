<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/base.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP&family=Shippori+Mincho&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">

        <div class="header-inner">

            <a href="./index.html" class="header-logo">
                <img src="../../DogMatch_Picture/DM_logo.png" alt="DogMatch-logo">
            </a>
            <button class="menu-button"></button>
            <!-- ボタンの説明的なの欲しい（肉球がメニューボタンだと分かりにくいから -->
            <div class="header-site-menu">
                <n class="site-menu">
                    <ul>
                        <li><a href="./index.html">Home</a></li>
                        <li><a href="./about.html">About</a></li>
                        <li><a href="./care.html">Care</a></li>
                        <li><a href="./life.html">Life</a></li>
                    </ul>
                </n>
            </div>
        </div>
    </header>
    <main>

    </main>
    <footer>
        <div class="site-menu">
            <nav class="base-menu">
                <ul>
                    <li><a href="./index.html">Home</a></li>
                    <li><a href="./about.html">About</a></li>
                    <li><a href="./care.html">Care</a></li>
                    <li><a href="./life.html">Life</a></li>
                </ul>
            </nav>
        </div>
        <div class="text-center">
            <div class="base-tel">
                <p>TEL 080-1111-1111</p>
            </div>
            <div class="base-time">
                <p>
                    電話対応のみ：9時〜20時
                </p>
            </div>
            <p class="copyright"><small>&copy;2026 ShibaDog</small></p>
            <p class="company">株式会社 柴犬をまるっと</p>
        </div>
    </footer>
    <script>
        //ここはメニューボタン（肉球）が押されたらメニューを出し、もう一度押されたら引っ込める役割
        const menuButton = document.querySelector('.menu-button');
        const headerSiteMenu = document.querySelector('.header-site-menu');
        menuButton.addEventListener('click', function () {
            headerSiteMenu.classList.toggle('show');
        });

        // fade-in
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('is-visible');
            });
        });
        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
        //→細かくなくて良い、これは結局何をしているjsなのか分かれば良い（これは、つけた名前をこのコード内から探して、cssで設定したpx分下げて配置しておいて、画面に映ったら元の位置に指定時間で戻す
        // ページ読み込み時:白から元に戻す

        // 画面のフェード　page-transition
        //1
        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('page-transition');
            requestAnimationFrame(() => {
                overlay.classList.remove('active'); // フェードアウト
            });
        });
        // リンククリック時:白くしてから遷移
        //2（役割はその場でページに飛ぶのをとめ、自分で設定した演習、時間を決めて移動させてる
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function (e) {
                const href = this.getAttribute('href');
                // hrefにクリックされたaタグのhref属性の値を読み込んでいる
                if (!href || href.startsWith('#')) {
                    return; // ここで処理を抜ける
                }
                e.preventDefault();//リンクを押した瞬間にすぐページが切り替わるのを止める。
                const overlay = document.getElementById('page-transition');
                overlay.classList.add('active');//→ 白いオーバーレイを表示する(すでに白い状態だから見た目上の変化はないけど、「今から白くなるぞ」という状態にする)
                //3
                setTimeout(() => {
                    window.location.href = href;
                }, 1000); // CSSのtransition時間と合わせる
            });
        });
        //最初から白くしておく（html)→リンクリックで2が動き、3で1秒まつ→待ったらページの読み込み→そのページも初めから白いため、1が動き、フェードアウト

        // カーソル設定
        let lastTime = 0;
        document.addEventListener('mousemove', function (e) {
            const now = Date.now(); // 今の時刻を取得
            if (now - lastTime < 150) {//時間設定
                return; // 前回置いてからまだINTERVALミリ秒経ってなければ何もしない
            }
            lastTime = now; // 今回置いた時刻を記録し直す
            const paw = document.createElement('img');//タグ作成
            paw.src = '../../DogMatch_Picture/cursor.png';
            paw.className = 'paw-trail';//cssで見た目を整えるための目印
            paw.style.left = e.pageX + 'px';
            paw.style.top = e.pageY + 'px';
            //マウスが動いたらその地点を記録
            document.body.appendChild(paw);//実際に追加

            // 一定時間後に消す(残り続けると重くなるため)
            setTimeout(() => {
                paw.remove();
            }, 800);
        });
    </script>
</body>

</html>
